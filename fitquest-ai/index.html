<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@200;300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/assets/fitquest-menu-bg.svg" />
    <link rel="preload" as="image" href="/assets/fitquest-logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/fitquest-mascot.webp" type="image/webp" fetchpriority="high" />
    <title>FitQuest AI</title>
    <style>
      /* Instant splash: painted before any JS loads, replaced by <LoadingScreen/> once React mounts. */
      #fq-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(ellipse at 70% 30%, #6a4fe0 0%, #3a2a9e 45%, #1c1366 100%); color: #fff; font-family: system-ui, "Segoe UI", sans-serif; }
      #fq-splash .fq-splash-inner { text-align: center; }
      #fq-splash .fq-splash-logo { padding-right: .12em; font-size: clamp(40px, 8vw, 84px); font-weight: 900; font-style: italic; letter-spacing: -.04em; background: linear-gradient(100deg, #ff9be8, #ffffff 45%, #7fe3ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(150, 120, 255, .7)); }
      #fq-splash .fq-splash-logo b { color: transparent; background: linear-gradient(#bff4ff, #38c8ff); -webkit-background-clip: text; background-clip: text; }
      #fq-splash .fq-splash-bar { width: min(56vw, 360px); height: 10px; margin: 22px auto 12px; border-radius: 99px; background: rgba(15, 10, 70, .6); border: 1px solid rgba(200, 190, 255, .5); overflow: hidden; }
      #fq-splash .fq-splash-bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff5fd2, #8f7bff, #38d4ff); animation: fq-splash-slide 1.1s ease-in-out infinite; }
      #fq-splash small { font-size: 13px; letter-spacing: .12em; opacity: .85; }
      @keyframes fq-splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="fq-splash"><div class="fq-splash-inner"><div class="fq-splash-logo">FitQuest <b>AI</b></div><div class="fq-splash-bar"><i></i></div><small>LOADING…</small></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
