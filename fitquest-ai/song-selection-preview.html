(-5deg)}.songtitle{font-size:clamp(23px,2.2vw,38px);font-weight:1000;line-height:1.1;margin:0 0 5px}.artist{font-size:15px;color:#ff69e6;font-weight:900}.artist span{color:#54eaff}.rule{height:1px;background:linear-gradient(90deg,#f44bdc,#686aff,transparent);margin:10px 0}.metarow{display:flex;gap:17px;font-weight:900;font-size:14px}.rating{margin-top:12px;padding:12px;border:1px solid #218ced;border-radius:18px;background:#0755b344}.rating small{display:block;color:#b8dfff;font-size:11px;font-weight:800}.rating b{display:inline-block;margin-top:5px;padding:5px 12px;border:1px solid #39d1ff;border-radius:20px;color:#a0eaff;font-size:12px}.stars{font-size:29px;letter-spacing:2px;color:#5cdeff;text-shadow:0 0 10px #43d6ff}.stars .empty{color:#565c9a;text-shadow:none}.desc{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid #3d4ec0;border-radius:16px;background:#10195f;font-size:12px;font-weight:700;line-height:1.55}.desc p{margin:0;flex:1}.wave{height:36px;display:flex;align-items:center;gap:3px}.wave i{width:5px;height:var(--h);background:linear-gradient(#5cefff,#b94bff,#ff62d6);border-radius:4px;animation:beat .8s infinite alternate;animation-delay:var(--d)}.rewardtitle{font-size:15px;font-weight:1000;margin-bottom:7px}.rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border:1px solid #4a4bc0;border-radius:17px;background:#111858}.reward{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid #9b6bff;border-radius:15px;background:linear-gradient(100deg,#342080,#141653)}.reward .icon{font-size:30px;filter:drop-shadow(0 0 7px #ffcb45)}.reward small{display:block;font-size:11px;color:#d8d1ff;font-weight:800}.reward strong{font-size:19px;font-weight:1000}.actions{display:flex;gap:14px;margin-top:auto}.back,.start{min-height:62px;border-radius:35px;padding:0 24px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(15px,1.4vw,23px);font-weight:1000;color:white;transition:.2s}.back{flex:0 0 31%;border:2px solid #9c8cff;background:linear-gradient(110deg,#292780,#11164d);box-shadow:0 0 14px #6d59ff50}.start{position:relative;overflow:hidden;flex:1;border:2px solid #ffd9ff;background:linear-gradient(100deg,#ff38d1,#e52dff 55%,#a04dff);box-shadow:0 0 0 2px #f78cff66,0 0 24px #ff32d5aa,inset 0 2px #fff8;text-shadow:0 2px 5px #9f178a}.back:hover,.start:hover{transform:translateY(-2px);filter:brightness(1.1)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:none;padding:12px 20px;border:1px solid #ff8bea;border-radius:20px;background:#17104bf2;box-shadow:0 0 22px #e83bff88}.toast.show{display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes beat{to{transform:scaleY(.45);opacity:.7}}@media(max-width:1050px){.app{padding:14px}.header{grid-template-columns:1fr 1.3fr}.profile{grid-column:1/-1;grid-row:2;justify-self:center;max-width:300px}.panels{grid-template-columns:1fr}.tracks{grid-template-columns:1fr 1fr}.track{grid-template-columns:28px 70px minmax(0,1fr) auto;gap:7px;min-height:72px}.art{width:70px;height:56px}.badge{grid-column:3;justify-self:start;padding:3px 7px;font-size:9px}.selected .mini{display:none}.selected .arrow{display:none}.volume{display:none}}@media(max-width:600px){.app{padding:9px}.header{grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.logo{width:145px}.tagline{font-size:7px}.headline{grid-column:1/-1;grid-row:2}.headline h1{font-size:25px}.profile{grid-column:2;grid-row:1;width:auto;padding:5px 8px;gap:6px}.profile img{width:34px;height:34px}.profile strong{font-size:11px}.profile small,.xptext{font-size:8px}.xp{height:4px}.library,.details{padding:10px}.panel{border-radius:17px}.tabs{gap:3px}.tab{font-size:8px;padding:7px 1px}.tab span{display:block}.tools{grid-template-columns:1fr}.sort{display:none}.tracks{grid-template-columns:1fr;gap:5px}.track{grid-template-columns:25px 58px minmax(0,1fr) auto;min-height:63px;padding:5px;border-radius:13px}.num{width:25px;height:32px;f </style></head><body><div class="bgfx"></div><main class="app">
<header class="header"><div><img class="logo" src="/assets/fitquest-logo.png" alt="FitQuest AI"><div class="tagline">MOVE • PLAY • GET FIT!</div></div><div class="headline"><h1>♫ เลือกเพลง ♫</h1><p>เลือกจังหวะที่ใช่ แล้วเริ่มออกกำลังกาย!</p></div><div class="profile"><img src="/assets/gameplay/cats/idle.webp" alt="Mascot"><div style="flex:1"><strong>👑 ผู้เล่น</strong><small>Lv. 1</small><div class="xp"><i></i></div><div class="xptext">0 / 800 XP</div></div></div></header>
<div class="panels"><section class="panel library"><div class="tabs"><button class="tab active" data-filter="all">♫ ทั้งหมด</button><button class="tab" data-filter="easy">★ ง่าย</button><button class="tab" data-filter="normal">★ ปกติ</button><button class="tab" data-filter="hard">★ ยาก</button><button class="tab" data-filter="expert">♛ ผู้เชี่ยวชาญ</button></div><div class="tools"><label class="search">⌕ <input id="search" placeholder="ค้นหาเพลง..." aria-label="ค้นหาเพลง"></label><label class="sort">☷ <select id="sort"><option value="new">เรียงตาม : ใหม่ล่าสุด</option><option value="bpm">เรียงตาม : BPM</option><option value="title">เรียงตาม : ชื่อเพลง</option></select></label></div>

<button class="track" data-id="1" data-difficulty="hard"><span class="num">02</span><span class="art pink"><img src="/assets/gameplay/cats/excited.webp" alt=""></span><span class="track-info"><strong>Pink Pulse</strong><small>Airi</small><em>♫ BPM 128</em></span><span class="badge hard">★ HARD</span><span class="mini">▶</span><span class="arrow">›</span></button>
<button class="track" data-id="2" data-difficulty="easy"><span class="num">03</span><span class="art blue"><img src="/assets/gameplay/cats/happy.webp" alt=""></span><span class="track-info"><strong>Star Jump</strong><small>Kira</small><em>♫ BPM 110</em></span><span class="badge easy">★ EASY</span><span class="mini">▶</span><span class="arrow">›</span></button>
<button class="track" data-id="3" data-difficulty="expert"><span class="num">04</span><span class="art gold"><img src="/assets/gameplay/cats/big.webp" alt=""></span><span class="track-info"><strong>Power Beat</strong><small>FitQuest Original</small><em>♫ BPM 140</em></span><span class="badge expert">♛ EXPERT</span><span class="mini">▶</span><span class="arrow">›</span></button>
<button class="track" data-id="4" data-difficulty="normal"><span class="num">05</span><span class="art blue"><img src="/assets/gameplay/cats/idle.webp" alt=""></span><span class="track-info"><strong>Moonlight Run</strong><small>Mika</small><em>♫ BPM 100</em></span><span class="badge">★ NORMAL</span><span class="mini">▶</span><span class="arrow">›</span></button></div>

<section class="panel details"><div class="top"><div class="cover"><img id="hero" src="/assets/gameplay/cats/cheer.webp" alt="ภาพเพลง"><div class="coverlabel" id="coverlabel">Neon<br>Steps</div></div><div><h2 class="songtitle" id="title">Neon Steps</h2><div class="artist" id="artist">FitQuest <span>Original</span></div><div class="rule"></div><div class="metarow"><span>♫ BPM <b id="bpm">120</b></span><span>◷ <b id="duration">02:15</b></span></div><div class="rating"><small>ระดับความยาก</small><b id="difficulty">★ NORMAL</b><div class="stars" id="stars">★ ★ <span class="empty">☆</span></div></div></div></div>
<div class="desc"><p id="description">ก้าวไปพร้อมกับจังหวะสุดมันส์ เผาผลาญแคลอรีไปด้วยกัน!</p><div class="wave" aria-hidden="true"><i style="--h:12px;--d:-.2s"></i><i style="--h:22px;--d:-.6s"></i><i style="--h:17px;--d:-.1s"></i><i style="--h:31px;--d:-.7s"></i><i style="--h:19px;--d:-.3s"></i><i style="--h:27px;--d:-.5s"></i><i style="--h:14px;--d:-.4s"></i></div></div><div><div class="rewardtitle">✦ รางวัลที่ได้รับ</div><div class="rewards"><div class="reward"><span class="icon">🌟</span><div><small>XP</small><strong>+50</strong></div></div><div class="reward"><span class="icon">🪙</span><div><small>เหรียญ</small><strong>+10</strong></div></div></div></div><div class="actions"><button class="back" id="back">← กลับ</button><button class="start" id="start"><span>▶</span><span>เริ่มเล่นเพลง</span><span>♫</span></button></div></section></div></main><div class="toast" id="toast" role="status"></div>
<script>
const songs=[{title:'Neon Steps',artist:'FitQuest Original',bpm:120,duration:'02:15',difficulty:'normal',label:'★ NORMAL',stars:2,art:'/assets/gameplay/cats/cheer.webp',desc:'ก้าวไปพร้อมกับจังหวะสุดมันส์ เผาผลาญแคลอรีไปด้วยกัน!'},{title:'Pink Pulse',artist:'Airi',bpm:128,duration:'02:42',difficulty:'hard',label:'★ HARD',stars:3,art:'/assets/gameplay/cats/excited.webp',desc:'ปล่อยพลังไปกับบีตสีชมพู จังหวะเร็วที่ท้าทายความคล่องตัวของคุณ'},{title:'Star Jump',artist:'Kira',bpm:110,duration:'02:08',difficulty:'easy',label:'★ EASY',stars:1,art:'/assets/gameplay/cats/happy.webp',desc:'เริ่มต้นอย่างสนุกสนาน ขยับตามจังหวะดาวและสะสมพลังบวกทุกก้าว'},{title:'Power Beat',artist:'FitQuest Original',bpm:140,duration:'03:00',difficulty:'expert',label:'♛ EXPERT',stars:3,art:'/assets/gameplay/cats/big.webp',desc:'ท้าทายขีดจำกัดด้วยจังหวะทรงพลัง เหมาะสำหรับผู้เล่นที่พร้อมลุย'},{title:'Moonlight Run',artist:'Mika',bpm:100,duration:'02:30',difficulty:'normal',label:'★ NORMAL',stars:2,art:'/assets/gameplay/cats/idle.webp',desc:'เคลื่อนไหวอย่างลื่นไหลในจังหวะที่พอดีกับคุณ'}];let selected=0,filter='all',page=1;const $=id=>document.getElementById(id),cards=[...document.querySelectorAll('.track')];function notify(t){const n=$('toast');n.textContent=t;n.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>n.classList.remove('show'),2200)}function choose(i){selected=i;const s=songs[i];cards.forEach((c,j)=>c.classList.toggle('selected',i===j));$('title').textContent=s.title;$('artist').textContent=s.artist;$('bpm').textContent=s.bpm;$('duration').textContent=s.duration;$('difficulty').textContent=s.label;$('stars').innerHTML='★ '.repeat(s.stars)+'<span class="empty">'+'☆ '.repeat(3-s.stars)+'</span>';$('hero').src=s.art;$('coverlabel').innerHTML=s.title.replace(' ','<br>');$('description').textContent=s.desc}function filterCards(){const q=$('search').value.toLowerCase().trim();let rows=songs.map((s,i)=>({s,i})).filter(x=>(filter==='all'||x.s.difficulty===filter)&&(x.s.title+' '+x.s.artist+' '+x.s.bpm).toLowerCase().includes(q));const sort=$('sort').value;if(sort==='bpm')rows.sort((a,b)=>a.s.bpm-b.s.bpm);if(sort==='title')rows.sort((a,b)=>a.s.title.localeCompare(b.s.title));cards.forEach(c=>c.hidden=!rows.some(x=>x.i===Number(c.dataset.id)))}cards.forEach((c,i)=>c.addEventListener('click',()=>choose(i)));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));filterCards()}));$('search').addEventListener('input',filterCards);$('sort').addEventListener('change',filterCards);$('prev').onclick=()=>{page=Math.max(1,page-1);$('page').textContent=page+' / 5'};$('next').onclick=()=>{page=Math.min(5,page+1);$('page').textContent=page+' / 5'};$('back').onclick=()=>notify('กลับไปยังเมนู FitQuest AI');$('start').onclick=()=>notify('เลือก '+songs[selected].title+' · BPM '+songs[selected].bpm+' — เชื่อมต่อ GameCanvas สำหรับเริ่มเกมจริง');choose(0);filterCards();
</script></body></html>
